name: publish

# Tags only, in the form <package>@<version>: ui-tweaks@0.1.0
on:
  push:
    tags:
      - '*@*'

permissions:
  contents: read
  id-token: write # Trusted Publishing: npm exchanges this OIDC token for a short-lived credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No registry-url on purpose. It would write an .npmrc expecting
      # NODE_AUTH_TOKEN, while Trusted Publishing authenticates by OIDC and has
      # no token at all.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted Publishing requires npm >= 11.5.1; Node 22 ships npm 10.
      # Pin the major rather than tracking "latest": npm 12 changed
      # `npm pack --json` to a name-keyed object, which broke the first CI run.
      # scripts/pack-dry.mjs now accepts both shapes, and the pin keeps CI
      # reproducible either way.
      - run: npm install -g npm@11

      - name: Resolve the package from the tag
        id: target
        run: |
          set -euo pipefail
          # <package>@<version>, where <package> is the directory name. Prefer the
          # directory because a scoped package name contains "/", which the tag
          # filter's "*" does not cross. A full package name is still accepted.
          name="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME##*@}"

          dir="packages/$name"
          if [ ! -d "$dir" ]; then
            dir=""
            for candidate in packages/*/; do
              if [ "$(node -p "require('./$candidate/package.json').name")" = "$name" ]; then
                dir="${candidate%/}"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "::error::no package matches the tag's name: $name"
            exit 1
          fi

          actual=$(node -p "require('./$dir/package.json').version")
          if [ "$actual" != "$version" ]; then
            echo "::error::tag says $version but $dir/package.json says $actual"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing $(node -p "require('./$dir/package.json').name")@$version from $dir"

      - run: npm run check
      - run: npm run pack:dry

      - name: Publish
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --access public
