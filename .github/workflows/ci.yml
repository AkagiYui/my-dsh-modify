name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing to install: every package is plain ESM and the checks are node
# scripts, so there is no lockfile and no `npm ci` step by design.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Manifests, patch rows, client factory ids, locales, icons
        run: npm run check

      - name: Tarball contents
        run: npm run pack:dry

      # client.js is generated. A source edit without a rebuild would publish a
      # stale browser half, so this fails the build instead.
      - name: Generated client.js matches src/
        if: matrix.node == '22'
        run: |
          node packages/copy-reply-image/build.mjs
          git diff --exit-code -- packages/copy-reply-image/client.js
